# Host ports are overridable so a port already taken on the host does not block
# the stack: RETRIEVAL_PORT=9001 docker compose up. Service-to-service URLs use
# container names and internal ports, so they are unaffected.
services:
  # The token defaults are development values and exist so the stack starts with no .env.
  # Render supplies real ones per service; nothing here is a production credential.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: deflect
      POSTGRES_PASSWORD: deflect
      POSTGRES_DB: deflect
    ports: ["${DB_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deflect"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro

  # Password-protected because Redis now decides who is logged in: anything that can write
  # a session: key mints an admin session for every service. It is published on a host
  # port, so "it is only localhost" is not the whole story. Render's Key Value instance is
  # private and authenticated; this is the local equivalent.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dev-redis-password}"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev-redis-password}", "ping"]
      interval: 5s
      retries: 10
    volumes:
      - redisdata:/data

  retrieval:
    build:
      context: .
      dockerfile: services/retrieval/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://deflect:deflect@db:5432/deflect_retrieval
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev-redis-password}@redis:6379/0
      ENV: ${ENV:-development}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-dev-operator-token}
      CORPUS_ROOT: /corpus
    ports: ["${RETRIEVAL_PORT:-8001}:8001"]
    depends_on:
      db:
        condition: service_healthy

  answer:
    build:
      context: .
      dockerfile: services/answer/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://deflect:deflect@db:5432/deflect_answer
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev-redis-password}@redis:6379/0
      RETRIEVAL_URL: http://retrieval:8001
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      ENV: ${ENV:-development}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-dev-operator-token}
    ports: ["${ANSWER_PORT:-8002}:8002"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      retrieval:
        condition: service_started

  evals:
    build:
      context: .
      dockerfile: services/evals/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://deflect:deflect@db:5432/deflect_evals
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev-redis-password}@redis:6379/0
      ANSWER_URL: http://answer:8002
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      DATASET_PATH: /app/evals/golden.yaml
      GIT_SHA: ${GIT_SHA:-unknown}
      ENV: ${ENV:-development}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-dev-operator-token}
    ports: ["${EVALS_PORT:-8003}:8003"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      answer:
        condition: service_started

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://deflect:deflect@db:5432/deflect_auth
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev-redis-password}@redis:6379/0
      ENV: ${ENV:-development}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-dev-operator-token}
    ports: ["${AUTH_PORT:-8004}:8004"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


  # Workers run the images already built, with a different command. Each needs its own
  # service's database and dependencies -- the ingest worker embeds, the eval worker
  # judges -- so a shared generic worker would have to carry both.
  retrieval-worker:
    build:
      context: .
      dockerfile: services/retrieval/Dockerfile
    command: ["python", "-m", "retrieval.worker"]
    # The loop catches per-job faults, but a process that dies anyway must come back:
    # its unacknowledged messages only return once something is consuming again.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://deflect:deflect@db:5432/deflect_retrieval
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev-redis-password}@redis:6379/0
      CORPUS_ROOT: /corpus
      ENV: ${ENV:-development}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-dev-operator-token}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  evals-worker:
    build:
      context: .
      dockerfile: services/evals/Dockerfile
    command: ["python", "-m", "evals.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://deflect:deflect@db:5432/deflect_evals
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev-redis-password}@redis:6379/0
      ANSWER_URL: http://answer:8002
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      DATASET_PATH: /app/evals/golden.yaml
      ENV: ${ENV:-development}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-dev-operator-token}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
