[project]
name = "deflect"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "google-genai>=0.3",
    "fastembed>=0.4",
    "pyyaml>=6.0",
    "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-env>=1.1", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# All tests share one event loop so the module-level asyncpg pool in
# deflect.db never hands a connection born on one loop to a test on another.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Retrieval tests assert which chunk ranks first, which only holds against a corpus
# they control. The development database holds the ingested FastAPI docs, so tests
# get their own database rather than competing with thousands of real chunks.
env = ["DATABASE_URL=postgresql+asyncpg://deflect:deflect@localhost:5432/deflect_test"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deflect"]
