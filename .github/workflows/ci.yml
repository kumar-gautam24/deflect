name: ci

on: [push, pull_request]

jobs:
  # One job per service. They share no state, so a failure names the service that
  # broke rather than "the backend".
  service:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [retrieval, answer, evals]
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: deflect
          POSTGRES_PASSWORD: deflect
          POSTGRES_DB: deflect
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deflect"
          --health-interval 5s --health-retries 10
    env:
      PGPASSWORD: deflect
      DATABASE_URL: postgresql+asyncpg://deflect:deflect@localhost:5432/deflect_${{ matrix.service }}
      SERVICE_TOKEN: ci-service-token
      OPERATOR_TOKEN: ci-operator-token
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync

      - name: Create this service's databases
        run: |
          psql "postgresql://deflect:deflect@localhost:5432/postgres" \
            -c "CREATE DATABASE deflect_${{ matrix.service }}"
          psql "postgresql://deflect:deflect@localhost:5432/postgres" \
            -c "CREATE DATABASE deflect_${{ matrix.service }}_test"

      - run: uv run alembic upgrade head
      - name: Migrate the test database
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://deflect:deflect@localhost:5432/deflect_${{ matrix.service }}_test

      - run: uv run ruff check .
      - run: uv run pytest -q

  contracts:
    # The wire schemas and the gate are the coupling point between services. A change
    # here breaks every service at once, so it gets a real suite of its own.
    runs-on: ubuntu-latest
    env:
      SERVICE_TOKEN: ci-service-token
      OPERATOR_TOKEN: ci-operator-token
    defaults:
      run:
        working-directory: packages/common
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  eval-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bring up the whole stack
        run: docker compose up -d --build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERVICE_TOKEN: ci-service-token
          OPERATOR_TOKEN: ci-operator-token

      - name: Wait for every service to report healthy
        run: |
          for port in 8001 8002 8003; do
            for attempt in $(seq 1 60); do
              curl -sf "http://localhost:$port/health" && break
              sleep 5
            done
          done

      - name: Migrate and ingest the pinned corpus
        run: |
          git clone --depth 1 https://github.com/fastapi/fastapi /tmp/fastapi-src
          docker compose exec -T retrieval alembic upgrade head
          docker compose exec -T answer alembic upgrade head
          docker compose exec -T evals alembic upgrade head
          docker compose cp /tmp/fastapi-src/docs/en/docs retrieval:/corpus
          curl -fsS -X POST localhost:8001/ingest \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ci-operator-token" \
            -d "{\"root\": \"/corpus\", \"commit_sha\": \"$(git -C /tmp/fastapi-src rev-parse HEAD)\"}"

      # The golden dataset names real document paths. This check needs the retrieval
      # service, so it runs here rather than in the isolated per-service job.
      # REQUIRE_CORPUS_CHECK turns an unreachable service into a failure instead of a
      # skip, so the check cannot quietly disappear.
      - name: Validate the golden dataset against the ingested corpus
        run: |
          docker compose exec -T \
            -e RETRIEVAL_URL=http://retrieval:8001 \
            -e REQUIRE_CORPUS_CHECK=1 \
            -e CORPUS_CHECK_TOKEN=ci-service-token \
            evals pytest tests/test_dataset.py -q

      # Fails the build when faithfulness regresses. This is the gate: a prompt
      # change that makes answers less grounded cannot merge. The smoke subset is
      # stratified so a limited run still exercises refusal.
      - name: Eval smoke set
        run: |
          curl -sf -X POST http://localhost:8003/runs \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ci-operator-token" \
            -d '{"limit": 10, "fail_under": 0.85}'

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 100
