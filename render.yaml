# Three services, three databases. Each owns its own schema and migrations; none
# reads another's tables.
services:
  - type: web
    name: deflect-retrieval
    runtime: docker
    dockerfilePath: ./services/retrieval/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: web
    name: deflect-answer
    runtime: docker
    dockerfilePath: ./services/answer/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
      # hostport yields host:port with no scheme. httpx rejects that as
      # UnsupportedProtocol, which the client would report as a transient outage
      # rather than the permanent misconfiguration it is.
      - key: RETRIEVAL_URL
        sync: false

  - type: web
    name: deflect-evals
    runtime: docker
    dockerfilePath: ./services/evals/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANSWER_URL
        sync: false
