name: ci

on: [push, pull_request]

jobs:
  # One job per service. They share no state, so a failure names the service that
  # broke rather than "the backend".
  service:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # gateway has no database of its own -- it only ever talks to the other four --
        # so the database and migration steps below are skipped for it rather than run
        # against a schema that does not exist.
        service: [retrieval, answer, evals, auth, gateway]
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: deflect
          POSTGRES_PASSWORD: deflect
          POSTGRES_DB: deflect
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deflect"
          --health-interval 5s --health-retries 10
    env:
      PGPASSWORD: deflect
      DATABASE_URL: postgresql+asyncpg://deflect:deflect@localhost:5432/deflect_${{ matrix.service }}
      SERVICE_TOKEN: ci-service-token
      OPERATOR_TOKEN: ci-operator-token
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync

      - name: Create this service's databases
        if: matrix.service != 'gateway'
        run: |
          psql "postgresql://deflect:deflect@localhost:5432/postgres" \
            -c "CREATE DATABASE deflect_${{ matrix.service }}"
          psql "postgresql://deflect:deflect@localhost:5432/postgres" \
            -c "CREATE DATABASE deflect_${{ matrix.service }}_test"

      - run: uv run alembic upgrade head
        if: matrix.service != 'gateway'
      - name: Migrate the test database
        if: matrix.service != 'gateway'
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://deflect:deflect@localhost:5432/deflect_${{ matrix.service }}_test

      - run: uv run ruff check .
      - run: uv run pytest -q

  contracts:
    # The wire schemas and the gate are the coupling point between services. A change
    # here breaks every service at once, so it gets a real suite of its own.
    runs-on: ubuntu-latest
    services:
      # _LEAK_LUA is a hand-written reimplementation of _decide in another language --
      # Lua cannot call the Python method, so the only thing that keeps the two from
      # drifting apart is test_redis_and_in_memory_buckets_agree, which was skipping on
      # every single push because this job never gave it a Redis to reach.
      #
      # No password here, unlike docker-compose. A `services:` container cannot take a
      # command, so the plain image has no way to be told --requirepass, and the
      # passworded alternatives are third-party tags that go away (bitnami/redis:7.2 was
      # tried and its manifest no longer exists). The password locally guards a Redis
      # published on a host port that decides who is logged in; this one lives for the
      # length of one job, is reachable only from it, and holds two float counters.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 10
    env:
      SERVICE_TOKEN: ci-service-token
      OPERATOR_TOKEN: ci-operator-token
      RATELIMIT_TEST_REDIS_URL: redis://localhost:6379/0
      # Turns "Redis unreachable" into a failure instead of a skip, the same pattern
      # REQUIRE_CORPUS_CHECK uses below for the golden-dataset check: a guard that can
      # silently vanish is worthless, and this one already did once.
      REQUIRE_RATELIMIT_REDIS_CHECK: "1"
    defaults:
      run:
        working-directory: packages/common
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  eval-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bring up the whole stack
        run: docker compose up -d --build
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: groq
          SERVICE_TOKEN: ci-service-token
          OPERATOR_TOKEN: ci-operator-token

      - name: Wait for every service to report healthy
        run: |
          # 8004 (auth) and 8000 (gateway) close a gap the auth sub-project left: without
          # them a broken auth image sailed through this job because nothing here ever
          # called it, and the gateway would have been no better watched.
          # The inner loop must FAIL when it runs out of attempts, not fall through. It
          # used to just move on, so a service that never booted was reported three steps
          # later as "service answer is not running" from an unrelated exec -- which named
          # the wrong step, blamed the wrong command, and hid the actual startup error in
          # container logs nobody had a reason to read.
          for port in 8001 8002 8003 8004 8000; do
            ready=""
            for attempt in $(seq 1 60); do
              curl -sf "http://localhost:$port/ready" && { ready=1; break; }
              sleep 5
            done
            if [ -z "$ready" ]; then
              echo "::error::no service answered /ready on port $port within five minutes"
              docker compose ps
              docker compose logs --tail 40
              exit 1
            fi
          done

      - name: Migrate and ingest the pinned corpus
        run: |
          git clone --depth 1 https://github.com/fastapi/fastapi /tmp/fastapi-src
          docker compose exec -T retrieval alembic upgrade head
          docker compose exec -T answer alembic upgrade head
          docker compose exec -T evals alembic upgrade head
          docker compose exec -T auth alembic upgrade head
          # Both containers need the corpus: the service validates the path, the
          # worker is what actually reads it.
          docker compose cp /tmp/fastapi-src/docs/en/docs retrieval:/corpus
          docker compose cp /tmp/fastapi-src/docs/en/docs retrieval-worker:/corpus

          # Ingest is a job now, so the build waits on the job rather than the request.
          JOB=$(curl -fsS -X POST localhost:8001/ingest \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ci-operator-token" \
            -d "{\"root\": \"/corpus\", \"commit_sha\": \"$(git -C /tmp/fastapi-src rev-parse HEAD)\"}" \
            | jq -r .job_id)

          for _ in $(seq 1 120); do
            STATUS=$(curl -fsS "localhost:8001/jobs/$JOB" \
              -H "Authorization: Bearer ci-operator-token" | jq -r .status)
            [ "$STATUS" = "done" ] && break
            [ "$STATUS" = "failed" ] && { echo "ingest failed"; exit 1; }
            sleep 10
          done
          [ "$STATUS" = "done" ] || { echo "ingest did not finish in 20 minutes"; exit 1; }

      # The golden dataset names real document paths. This check needs the retrieval
      # service, so it runs here rather than in the isolated per-service job.
      # REQUIRE_CORPUS_CHECK turns an unreachable service into a failure instead of a
      # skip, so the check cannot quietly disappear.
      - name: Validate the golden dataset against the ingested corpus
        run: |
          docker compose exec -T \
            -e RETRIEVAL_URL=http://retrieval:8001 \
            -e REQUIRE_CORPUS_CHECK=1 \
            -e CORPUS_CHECK_TOKEN=ci-service-token \
            evals pytest tests/test_dataset.py -q

      # Ten items is roughly fourteen minutes against Groq's free tier of 8,000 tokens a
      # minute. Blocking every pull request for that long trains people to ignore the
      # gate, so only this step waits for main -- the steps above it spend no tokens and
      # keep guarding every pull request, including the golden-dataset check that is the
      # only thing catching a typo in expected_sources.
      - name: Skip the token-spending gate on pull requests
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: echo "eval gate runs on main pushes and nightly; see the comment above"

      # Fails the build when faithfulness regresses. This is the gate: a prompt
      # change that makes answers less grounded cannot merge. The smoke subset is
      # stratified so a limited run still exercises refusal.
      - name: Eval smoke set
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # fail_under no longer applies at submission -- nothing has been scored yet --
          # so the build polls the run and applies the threshold itself.
          RUN=$(curl -fsS -X POST http://localhost:8003/runs \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ci-operator-token" \
            -d '{"limit": 10}' | jq -r .run_id)

          for _ in $(seq 1 180); do
            STATUS=$(curl -fsS "localhost:8003/eval-runs/$RUN" | jq -r .status)
            [ "$STATUS" = "complete" ] && break
            sleep 10
          done
          [ "$STATUS" = "complete" ] || { echo "eval run did not finish"; exit 1; }

          SCORE=$(curl -fsS "localhost:8003/eval-runs/$RUN" | jq -r .metrics.faithfulness)
          SCORED=$(curl -fsS "localhost:8003/eval-runs/$RUN" | jq -r .item_count)
          echo "faithfulness $SCORE over $SCORED items"
          awk -v s="$SCORE" 'BEGIN { exit (s >= 0.85) ? 0 : 1 }' \
            || { echo "faithfulness below 0.85"; exit 1; }

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 100
