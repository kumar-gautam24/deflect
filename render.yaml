# Three services, three databases. Each owns its own schema and migrations; none
# reads another's tables.
services:
  - type: web
    name: deflect-retrieval
    runtime: docker
    dockerfilePath: ./services/retrieval/Dockerfile
    dockerContext: .
    # Readiness, not liveness: this decides whether a deploy can serve traffic,
    # not merely whether its process exists.
    healthCheckPath: /ready
    envVars:
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      # Both services on a call must carry the same SERVICE_TOKEN, so these are set
      # by hand rather than with generateValue, which would mint a different one each.
      - key: SERVICE_TOKEN
        sync: false
      - key: OPERATOR_TOKEN
        sync: false
      - key: ENV
        sync: false
      - key: CORPUS_ROOT
        sync: false

  - type: web
    name: deflect-answer
    runtime: docker
    dockerfilePath: ./services/answer/Dockerfile
    dockerContext: .
    # Readiness, not liveness: this decides whether a deploy can serve traffic,
    # not merely whether its process exists.
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
      # hostport yields host:port with no scheme. httpx rejects that as
      # UnsupportedProtocol, which the client would report as a transient outage
      # rather than the permanent misconfiguration it is.
      - key: RETRIEVAL_URL
        sync: false
      # Both services on a call must carry the same SERVICE_TOKEN, so these are set
      # by hand rather than with generateValue, which would mint a different one each.
      - key: SERVICE_TOKEN
        sync: false
      - key: OPERATOR_TOKEN
        sync: false
      - key: ENV
        sync: false

  - type: web
    name: deflect-evals
    runtime: docker
    dockerfilePath: ./services/evals/Dockerfile
    dockerContext: .
    # Readiness, not liveness: this decides whether a deploy can serve traffic,
    # not merely whether its process exists.
    healthCheckPath: /ready
    envVars:
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANSWER_URL
        sync: false
      # Both services on a call must carry the same SERVICE_TOKEN, so these are set
      # by hand rather than with generateValue, which would mint a different one each.
      - key: SERVICE_TOKEN
        sync: false
      - key: OPERATOR_TOKEN
        sync: false
      - key: ENV
        sync: false

  # Workers: the same images, a different command. type: worker means no port and no
  # health check -- they consume a queue rather than serving requests.
  - type: worker
    name: deflect-retrieval-worker
    runtime: docker
    dockerfilePath: ./services/retrieval/Dockerfile
    dockerContext: .
    dockerCommand: python -m retrieval.worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SERVICE_TOKEN
        sync: false
      - key: OPERATOR_TOKEN
        sync: false
      - key: CORPUS_ROOT
        sync: false

  - type: worker
    name: deflect-evals-worker
    runtime: docker
    dockerfilePath: ./services/evals/Dockerfile
    dockerContext: .
    dockerCommand: python -m evals.worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANSWER_URL
        sync: false
      - key: SERVICE_TOKEN
        sync: false
      - key: OPERATOR_TOKEN
        sync: false
