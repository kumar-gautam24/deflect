[project]
name = "deflect-retrieval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deflect-common",
    "fastapi>=0.115",
    "gunicorn>=23.0",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "fastembed>=0.4",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-env>=1.1", "ruff>=0.8", "httpx>=0.28"]

[tool.uv.sources]
deflect-common = { path = "../../packages/common", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
env = ["DATABASE_URL=postgresql+asyncpg://deflect:deflect@localhost:5432/deflect_retrieval_test"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval"]
