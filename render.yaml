# Three services, three databases. Each owns its own schema and migrations; none
# reads another's tables.
services:
  # The private split (type: pserv) was attempted for these four and abandoned: Render
  # Private Services require a paid instance type, and nothing in this repo or the
  # connected Render account establishes which plan this deploy runs on -- the only
  # account reachable at the time of writing owns an unrelated project, so querying it
  # would have answered a question about someone else's plan, not this one. Guessing
  # would have made this comment, and the README paragraph that mirrors it, a false claim
  # the next reader has no way to catch.
  #
  # So these four stay type: web and are reachable directly, not only through the
  # gateway. The gateway is a front door beside other doors, not the only one. What
  # actually protects these routes is unchanged by that: principal_guard resolves and
  # checks every credential itself rather than trusting the gateway's verdict, and each
  # service's own ENV check keeps its interactive docs off in production regardless of
  # which door a request came through.
  - type: web
    name: deflect-retrieval
    runtime: docker
    dockerfilePath: ./services/retrieval/Dockerfile
    dockerContext: .
    # Readiness, not liveness: this decides whether a deploy can serve traffic,
    # not merely whether its process exists.
    healthCheckPath: /ready
    envVars:
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      # Both services on a call must carry the same SERVICE_TOKEN, so these are set
      # by hand rather than with generateValue, which would mint a different one each.
      - key: SERVICE_TOKEN
        sync: false
      - key: OPERATOR_TOKEN
        sync: false
      # Not a secret, and sync: false would leave production docs public and
      # abuse checks off for any operator who skips setting it by hand.
      - key: ENV
        value: production
      - key: CORPUS_ROOT
        sync: false

  - type: web
    name: deflect-answer
    runtime: docker
    dockerfilePath: ./services/answer/Dockerfile
    dockerContext: .
    # Readiness, not liveness: this decides whether a deploy can serve traffic,
    # not merely whether its process exists.
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
      # hostport yields host:port with no scheme. httpx rejects that as
      # UnsupportedProtocol, which the client would report as a transient outage
      # rather than the permanent misconfiguration it is.
      - key: RETRIEVAL_URL
        sync: false
      # Both services on a call must carry the same SERVICE_TOKEN, so these are set
      # by hand rather than with generateValue, which would mint a different one each.
      - key: SERVICE_TOKEN
        sync: false
      - key: OPERATOR_TOKEN
        sync: false
      # Not a secret, and sync: false would leave production docs public and
      # abuse checks off for any operator who skips setting it by hand.
      - key: ENV
        value: production

  - type: web
    name: deflect-evals
    runtime: docker
    dockerfilePath: ./services/evals/Dockerfile
    dockerContext: .
    # Readiness, not liveness: this decides whether a deploy can serve traffic,
    # not merely whether its process exists.
    healthCheckPath: /ready
    envVars:
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANSWER_URL
        sync: false
      # Both services on a call must carry the same SERVICE_TOKEN, so these are set
      # by hand rather than with generateValue, which would mint a different one each.
      - key: SERVICE_TOKEN
        sync: false
      - key: OPERATOR_TOKEN
        sync: false
      # Not a secret, and sync: false would leave production docs public and
      # abuse checks off for any operator who skips setting it by hand.
      - key: ENV
        value: production

  - type: web
    name: deflect-auth
    runtime: docker
    dockerfilePath: ./services/auth/Dockerfile
    dockerContext: .
    # Readiness, not liveness: this decides whether a deploy can serve traffic,
    # not merely whether its process exists.
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # Both services on a call must carry the same SERVICE_TOKEN, so these are set
      # by hand rather than with generateValue, which would mint a different one each.
      - key: SERVICE_TOKEN
        sync: false
      - key: OPERATOR_TOKEN
        sync: false
      # Not a secret, and sync: false would leave production docs public and
      # abuse checks off for any operator who skips setting it by hand.
      - key: ENV
        value: production

  - type: web
    name: deflect-gateway
    runtime: docker
    dockerfilePath: ./services/gateway/Dockerfile
    dockerContext: .
    # Readiness, not liveness: this decides whether a deploy can serve traffic,
    # not merely whether its process exists.
    healthCheckPath: /ready
    envVars:
      # Internal addresses, not secrets: Render's private network resolves a service by
      # its name, and every service here keeps the fixed port its Dockerfile binds.
      - key: RETRIEVAL_URL
        value: http://deflect-retrieval:8001
      - key: ANSWER_URL
        value: http://deflect-answer:8002
      - key: EVALS_URL
        value: http://deflect-evals:8003
      - key: AUTH_URL
        value: http://deflect-auth:8004
      - key: REDIS_URL
        sync: false
      # Both services on a call must carry the same SERVICE_TOKEN, so these are set
      # by hand rather than with generateValue, which would mint a different one each.
      - key: SERVICE_TOKEN
        sync: false
      - key: OPERATOR_TOKEN
        sync: false
      # One hop: Render's own edge sits in front of this service and appends the real
      # client to X-Forwarded-For, so edge_address takes the rightmost entry rather than
      # falling back to the peer, which on Render would be Render's own load balancer.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Not a secret, and sync: false would leave production docs public and
      # abuse checks off for any operator who skips setting it by hand.
      - key: ENV
        value: production

  # Workers: the same images, a different command. type: worker means no port and no
  # health check -- they consume a queue rather than serving requests.
  - type: worker
    name: deflect-retrieval-worker
    runtime: docker
    dockerfilePath: ./services/retrieval/Dockerfile
    dockerContext: .
    dockerCommand: python -m retrieval.worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SERVICE_TOKEN
        sync: false
      - key: OPERATOR_TOKEN
        sync: false
      # A disk, because the worker is the process that reads the corpus. Without one,
      # CORPUS_ROOT points at an empty path and every ingest succeeds with zero chunks --
      # which is exactly how this went unnoticed in development.
      - key: CORPUS_ROOT
        sync: false
    disk:
      name: corpus
      mountPath: /corpus
      sizeGB: 1

  - type: worker
    name: deflect-evals-worker
    runtime: docker
    dockerfilePath: ./services/evals/Dockerfile
    dockerContext: .
    dockerCommand: python -m evals.worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # The worker builds its own judge client and loads its own dataset, so it needs
      # every provider setting the service has -- it is not a thin shell around it.
      - key: LLM_PROVIDER
        sync: false
      - key: DATASET_PATH
        sync: false
      - key: ANSWER_URL
        sync: false
      - key: SERVICE_TOKEN
        sync: false
      - key: OPERATOR_TOKEN
        sync: false

# Redis carries work; Postgres carries truth. Losing this costs in-flight delivery, not
# history, which is why a small instance is enough.
services_note: |
  Create a Render Key Value instance and set its connection string as REDIS_URL on
  deflect-retrieval, deflect-answer, deflect-evals, deflect-auth and both workers. It is
  declared here as a note rather than a service block because Render provisions key-value
  stores outside the services list.
